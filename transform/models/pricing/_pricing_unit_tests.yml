    - well_month_id: a
      idpozo: 1
      idempresa: A
      idareapermisoconcesion: X
      periodo: '2026-01-01'
      prod_pet_m3: 10
    - well_month_id: b
      idpozo: 2
      idempresa: A
      idareapermisoconcesion: X
      periodo: '2026-02-01'
      prod_pet_m3: 10
    - well_month_id: c
      idpozo: 3
      idempresa: A
      idareapermisoconcesion: X
      periodo: '2026-01-01'
      prod_pet_m3: -1
