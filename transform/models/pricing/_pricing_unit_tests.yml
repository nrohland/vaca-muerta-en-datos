      accepted_cutoff: '2026-08-01'
    - product: oil
      periodo: '2026-03-01'
      benchmark: EIA_BRENT_MONTHLY
      price: 0
      price_valid: false
      snapshot_id: fixture
      source_sha256: fixture
      retrieved_at: '2026-10-12 12:00:00'
      source_updated_at: '2026-10-07'
      accepted_cutoff: '2026-08-01'
