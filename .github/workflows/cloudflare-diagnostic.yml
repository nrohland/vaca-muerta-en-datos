name: Cloudflare source diagnosis
on:
  push:
    branches: [test/cloudflare-source-connectivity]
  workflow_dispatch:
permissions: {}
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public Worker without credentials
        shell: python
        run: |
          import json, urllib.request, urllib.error
          base = 'https://vm-source-diagnostic.nicolas-rohland.workers.dev'
          failed = False
          for path in ['/health','/probe/resource','/probe/catalogue']:
              req = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'VacaMuertaEnDatos-connectivity-diagnostic/1.0'})
              try:
                  response = urllib.request.urlopen(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              except (urllib.error.URLError, TimeoutError):
                  print(json.dumps({'path':path,'error':'worker_unreachable'}), flush=True)
                  failed = True
                  continue
              with response:
                  raw = response.read(8193)
                  try: payload = json.loads(raw) if len(raw) <= 8192 else None
                  except ValueError: payload = None
                  print(json.dumps({'path':path,'status':response.status,'cf_placement':response.headers.get('cf-placement'),'diagnostic':payload,'server':response.headers.get('server'),'cf_ray':response.headers.get('cf-ray'),'public_error':raw.decode('utf-8',errors='replace')[:1200] if payload is None else None}), flush=True)
                  failed |= response.status != 200 or payload is None
                  if path.startswith('/probe/'):
                      failed |= not isinstance(payload, dict) or payload.get('http_status') != 200
          if failed: raise SystemExit('Origin not confirmed reachable through Worker')
