# Historical basin-rate spike contract (dbt Core, free); not the current frontend publication cutoff.
# Not MetricFlow: a time spine would add BigQuery cost for a 1-row headline.
# dbt reads the same numbers from dbt_project.yml `vars.m3_to_bbl` and from
# models/marts/fct_production_rate.yml `config.meta`. Do not introduce a second factor.

m3_to_bbl: 6.28981077
is_simulation: true
not_telemetry: true
disclaimer: simulación a partir de datos mensuales oficiales
grain: one_row_latest_cap4_month_total_vm_noconv
mart: fct_production_rate

metrics:
  production_rate_bbl_dia:
    label: Vaca Muerta en Datos rate bbl/día
    column: rate_bbl_dia
    unit: bbl/día
    formula: rate_m3_dia * 6.28981077
    m3_to_bbl: 6.28981077
    description: >
      Basin calendar rate used by the historical spike. Capítulo IV is monthly.
      Current frontend consumes accepted-period publication artifacts, not a live counter.
  production_rate_m3_dia:
    label: Vaca Muerta en Datos rate m³/día
    column: rate_m3_dia
    unit: m3/día
    formula: sum(prod_pet_m3) / days_in_month(periodo)
    m3_to_bbl: 6.28981077
    description: Same rate in cubic metres per day (tooltip / other views).
