- name: dual_reference_units_and_energy_basis_are_explicit
  model: stg_monthly_reference_price
  config: &id001
    enabled: '{{ target.name == ''candidate'' and var(''enable_candidate_pricing'',
      false) }}'
  given:
  - input: source('candidate_pricing', 'monthly_reference_price')
    rows:
    - product: oil
      periodo: '2026-01-01'
      price: 80
      currency: USD
      price_unit: bbl
      benchmark: EIA_BRENT_MONTHLY
      energy_basis: null
      accepted_cutoff: '2026-08-01'
    - product: gas
      periodo: '2026-01-01'
      price: 2
      currency: USD
      price_unit: MMBTU
      benchmark: EIA_HENRY_HUB_MONTHLY
