      idpozo: 4
      idempresa: A
      idareapermisoconcesion: X
      periodo: '2026-01-01'
      prod_pet_m3: 0
    - well_month_id: e
      idpozo: 5
      idempresa: A
      idareapermisoconcesion: X
      periodo: '2026-03-01'
      prod_pet_m3: 10
  - input: ref('stg_monthly_reference_price')
    rows:
