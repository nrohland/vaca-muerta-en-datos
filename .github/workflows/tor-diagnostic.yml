name: Tor SOCKS5 official source experiment
on:
  push:
    branches: [test/tor-source-connectivity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install diagnostic clients on the ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tor
          python -m pip install curl_cffi==0.17.0
      - name: Bootstrap client-only Tor using the Ubuntu service
        run: |
          sudo install -d -m 2750 -o debian-tor -g adm /var/log/tor
          sudo tee /etc/tor/torrc >/dev/null <<'TORRC'
          ClientOnly 1
          SocksPort 127.0.0.1:19050 IsolateSOCKSAuth
          DataDirectory /var/lib/tor
          Log notice file /var/log/tor/notices.log
          TORRC
          sudo -u debian-tor tor --verify-config -f /etc/tor/torrc
          sudo systemctl restart tor@default
          python - <<'PYBOOT'
          import json, subprocess, time
          for _ in range(60):
              log=subprocess.run(['sudo','cat','/var/log/tor/notices.log'],capture_output=True,text=True)
              if 'Bootstrapped 100%' in log.stdout:
                  print(json.dumps({'tor_bootstrap':'ready','client_only':True}))
                  break
              time.sleep(2)
          else:
              print(json.dumps({'tor_bootstrap':'unavailable','source_tested':False}))
              subprocess.run(['sudo','systemctl','status','tor@default','--no-pager'])
              raise SystemExit(1)
          PYBOOT
      - name: Probe bounded official metadata and CSV prefixes via SOCKS5 remote DNS
        run: python diagnostics/curl-cffi/probe.py --tor
      - name: Stop the diagnostic Tor client
        if: always()
        run: sudo systemctl stop tor@default
