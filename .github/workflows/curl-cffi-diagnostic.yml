name: curl-cffi source connectivity experiment
on:
  push:
    branches: [test/curl-cffi-source-connectivity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned diagnostic client
        run: python -m pip install curl_cffi==0.17.0
      - name: Compare plain curl with Chrome TLS profiles on actual official endpoints
        run: python diagnostics/curl-cffi/probe.py
