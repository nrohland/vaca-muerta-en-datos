name: Cap IV candidate pipeline (official CSV + dbt pricing)

on:
  workflow_dispatch:
    inputs:
      resource_check_only:
        description: 'Read-only resource access check; no public downloads, loads or queries'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 5 * *'

permissions:
  contents: read

concurrency:
  group: cap4-candidate-dev
  cancel-in-progress: false

jobs:
  extract:
    # Manual validation on main is independent of the disabled recurring schedule.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DATA_PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: data-dev-extract
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            extraction/requirements.txt
            transform/requirements.txt
      - name: Install candidate extraction dependencies
        run: python -m pip install -r extraction/requirements.txt
      - name: Prepare public CSV and EIA snapshots before authentication
        if: ${{ !inputs.resource_check_only }}
        run: python pipeline/run_candidate.py prepare --history --run-dir "$RUNNER_TEMP/vm-prepare" --scratch-dir "$RUNNER_TEMP/vm-source-files"
      - name: Authenticate extraction (stage-restricted WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_EXTRACT_SA }}
      - name: Check resource access without loads or queries
        if: ${{ inputs.resource_check_only }}
        run: python pipeline/resource_preflight.py --output "$RUNNER_TEMP/vm-extract/resource-preflight.json"
      - name: Load and revalidate the prepared snapshots
        if: ${{ !inputs.resource_check_only }}
        run: python pipeline/run_candidate.py load --history --prepared-artifact "$RUNNER_TEMP/vm-prepare" --run-dir "$RUNNER_TEMP/vm-extract" --scratch-dir "$RUNNER_TEMP/vm-source-files"
      - name: Keep metadata evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-extraction-checks
          path: ${{ runner.temp }}/vm-extract/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve public preparation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-public-preparation
          path: |
            ${{ runner.temp }}/vm-prepare/run.json
            ${{ runner.temp }}/vm-prepare/source-preparation-metrics.json
            ${{ runner.temp }}/vm-prepare/price-preparation-metrics.json
          retention-days: 7
          if-no-files-found: ignore

  transform:
    needs: extract
    if: ${{ !inputs.resource_check_only }}
    runs-on: ubuntu-latest
    environment: data-dev-dbt
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            extraction/requirements.txt
            transform/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies before authentication
        working-directory: apps/web
        run: npm ci
      - name: Install pinned dbt Core
        run: python -m pip install -r transform/requirements.txt -r extraction/requirements.txt
      - name: Check pipeline gates before authentication
        run: python -m unittest discover -s pipeline/tests
      - name: Download pinned dbt packages before authentication
        run: |
          mkdir -p "$RUNNER_TEMP/vm-dbt-profile"
          cp transform/ci-profiles.yml.example "$RUNNER_TEMP/vm-dbt-profile/profiles.yml"
          dbt deps --project-dir transform --profiles-dir "$RUNNER_TEMP/vm-dbt-profile" --target candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-extraction-checks
          path: ${{ runner.temp }}/vm-extract-evidence
      - name: Authenticate transformation (separate stage-restricted WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_DBT_SA }}
      - name: Revalidate and build the reviewed candidate
        run: python pipeline/run_candidate.py transform --history --extract-artifact "$RUNNER_TEMP/vm-extract-evidence" --run-dir "$RUNNER_TEMP/vm-transform"
      - name: Validate and build frontend with the generated candidate
        run: |
          cp "$RUNNER_TEMP/vm-transform/dashboard/release.json" apps/web/public/data/release.json
          cp "$RUNNER_TEMP/vm-transform/dashboard/manifest.json" apps/web/public/data/manifest.json
          cp "$RUNNER_TEMP/vm-transform/dashboard/prices.json" apps/web/public/data/prices.json
          cp "$RUNNER_TEMP/vm-transform/dashboard/valuation-manifest.json" apps/web/public/data/valuation-manifest.json
          if [ -d "$RUNNER_TEMP/vm-transform/dashboard/map" ]; then
            cp -R "$RUNNER_TEMP/vm-transform/dashboard/map" apps/web/public/data/
          fi
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - name: Keep sanitized metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-dbt-checks
          path: ${{ runner.temp }}/vm-transform/*.json
          if-no-files-found: ignore
          retention-days: 7
