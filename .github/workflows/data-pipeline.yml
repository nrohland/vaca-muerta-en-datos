name: Cap IV candidate pipeline (official CSV + dbt pricing)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 5 * *'

permissions:
  contents: read

concurrency:
  group: cap4-candidate-dev
  cancel-in-progress: false

jobs:
  extract:
    if: vars.DATA_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: data-dev-extract
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate extraction dependencies
        run: python -m pip install 'google-cloud-bigquery==3.46.1'
      - name: Authenticate extraction (stage-restricted WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_EXTRACT_SA }}
      - name: Run reviewed CSV and price extraction
        run: python pipeline/run_candidate.py extract --run-dir "$RUNNER_TEMP/vm-extract" --scratch-dir "$RUNNER_TEMP/vm-source-files"
      - name: Keep metadata evidence only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-extraction-checks
          path: ${{ runner.temp }}/vm-extract/*.json
          if-no-files-found: ignore
          retention-days: 7

  transform:
    needs: extract
    runs-on: ubuntu-latest
    environment: data-dev-dbt
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dbt Core
        run: python -m pip install -r transform/requirements.txt
      - name: Download pinned dbt packages before authentication
        run: |
          mkdir -p "$RUNNER_TEMP/vm-dbt-profile"
          cp transform/ci-profiles.yml.example "$RUNNER_TEMP/vm-dbt-profile/profiles.yml"
          dbt deps --project-dir transform --profiles-dir "$RUNNER_TEMP/vm-dbt-profile" --target candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-extraction-checks
          path: ${{ runner.temp }}/vm-extract-evidence
      - name: Authenticate transformation (separate stage-restricted WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_DBT_SA }}
      - name: Revalidate and build the reviewed candidate
        run: python pipeline/run_candidate.py transform --extract-artifact "$RUNNER_TEMP/vm-extract-evidence" --run-dir "$RUNNER_TEMP/vm-transform"
      - name: Keep sanitized metadata only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-dbt-checks
          path: ${{ runner.temp }}/vm-transform/*.json
          if-no-files-found: ignore
          retention-days: 7
