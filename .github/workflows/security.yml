name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject environment files and credentials across the complete history
        run: |
          python3 scripts/test_check_publication.py
          python3 scripts/check_publication.py --history
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 0 --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan fetched history with fully redacted findings
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' --ignore-gitleaks-allow --max-decode-depth=2 --redact=100 --no-banner --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json"
      # Potential-secret reports are not uploaded as public artifacts.

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify fail-closed audit policy
        run: python scripts/test_security_audit.py
      - name: Audit locked JavaScript and reviewed framework minimums
        run: python scripts/security_audit.py --directory apps/web
      - name: Audit Python requirements and resolved dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r extraction/requirements.txt -r transform/requirements.txt -r transform/requirements-audit.txt --progress-spinner off


  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: '/language:${{ matrix.language }}'
