version: 2

models:
  - name: fct_production_rate
    description: >
      **Historical basin rate contract (Hito 2 spike).** One row = total Vaca Muerta
      non-conventional **basin** oil rate for the **latest Capítulo IV month**
      in `fct_well_month`. Not per company, not per well, not telemetry.

      Headline rate: `sum(prod_pet_m3) / days_in_month(periodo)`
      (`rate_method = calendar_days`). This is basin bbl/día (~590k on
      Dec-2025 Pulse), the number the counter interpolates.

      `sum(prod_pet_m3) / nullif(sum(tef), 0)` is **productivity**
      (`productivity_bbl_dia`, ~260 bbl per well-day on that snapshot).
      It is a KPI, not Vaca Muerta en Datos. Warehouse 2025 Pulse used the productivity
      formula as headline by mistake (spike v1).

      Conversion: `rate_bbl_dia = rate_m3_dia × 6.28981077` via
      `var('m3_to_bbl')` — the same number as `_metrics.yml`. Front MUST
      interpolate from `rate_bbl_dia` and show *simulación a partir de
      datos mensuales oficiales*. Alias `mart_production_headline` is retired;
      this is the only identifier for the historical spike.
      The current dashboard consumes an accepted-period publication snapshot;
      this latest-raw-period oil-only model does not enforce that publication cutoff.
    config:
      meta:
        product: Vaca Muerta en Datos
        grain: one_row_latest_cap4_month_total_vm_noconv
        m3_to_bbl: 6.28981077
        is_simulation: true
        not_telemetry: true
        headline_formula: sum(prod_pet_m3) / days_in_month
        disclaimer: simulación a partir de datos mensuales oficiales
        metrics:
          production_rate_bbl_dia:
            column: rate_bbl_dia
            formula: rate_m3_dia * 6.28981077
            m3_to_bbl: 6.28981077
            unit: bbl/día
          production_rate_m3_dia:
            column: rate_m3_dia
            unit: m3/día
            m3_to_bbl: 6.28981077
    columns:
      - name: periodo
        description: Latest Cap. IV business month (DATE YYYY-MM-01). Primary key.
        data_tests:
          - unique
          - not_null
      - name: anio
        description: Year of that month.
        data_tests:
          - not_null
      - name: mes
        description: Month number of that month.
        data_tests:
          - not_null
      - name: prod_pet_m3
        description: Sum of well-month oil m³ for the Pulse cut in `periodo`.
      - name: tef_sum
        description: Sum of tef. Denominator of productivity, not of Vaca Muerta en Datos.
      - name: days_in_month
        description: Calendar days of `periodo`. Headline denominator.
      - name: well_month_row_count
        description: Rows of fct_well_month in the latest month (QA / Front).
      - name: rate_m3_dia
        description: Basin daily oil rate in m³/día (`prod / days_in_month`).
      - name: rate_m3_per_day
        description: Alias of rate_m3_dia for Front/IA.
      - name: rate_bbl_dia
        description: >
          Basin daily oil rate in barrels/day. Headline input for the Vaca Muerta en Datos
          counter. `rate_m3_dia × 6.28981077`. Do not recompute the factor
          in the browser. Do not use productivity_bbl_dia here.
        data_tests:
          - not_null
      - name: rate_bbl_per_day
        description: Alias of rate_bbl_dia for Front/IA.
      - name: productivity_m3_dia
        description: >
          Well-day productivity `sum(prod)/sum(tef)` in m³/día. Null when
          tef_sum = 0. Not the headline.
      - name: productivity_bbl_dia
        description: Same productivity in bbl per well-day. Not the headline.
      - name: rate_method
        description: "`calendar_days` — basin headline. Productivity is a separate column."
        data_tests:
          - accepted_values:
              arguments:
                values: ["calendar_days"]
          - not_null
      - name: source_batched_at_max
        description: Max Singer batch timestamp in the latest month (freshness, not Cap. IV month).
      - name: fecha_data_max
        description: Max official `fecha_data` in the latest month.
      - name: is_simulation
        description: Always true. Capítulo IV is monthly; the UI counter is interpolated.
      - name: disclaimer
        description: Copy Front MUST show next to the counter.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(rate_bbl_dia - rate_m3_dia * {{ var('m3_to_bbl') }}) < 0.0000001"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "rate_bbl_dia = rate_bbl_per_day and rate_m3_dia = rate_m3_per_day"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(rate_m3_dia - prod_pet_m3 / days_in_month) < 0.0000001"

unit_tests:
  - name: production_headline_is_basin_calendar_not_tef
    description: >
      Headline uses days_in_month even when tef_sum > 0. tef path is
      productivity, not Vaca Muerta en Datos. Not telemetry.
    model: fct_production_rate
    given:
      - input: ref("fct_well_month")
        rows:
          - periodo: 2025-01-01
            anio: 2025
            mes: 1
            prod_pet_m3: 62.0
            tef: 15.5
            days_in_month: 31
            source_batched_at: 2026-02-01 00:00:00-0
            fecha_data: 2025-02-01 00:00:00-0
          - periodo: 2025-01-01
            anio: 2025
            mes: 1
            prod_pet_m3: 0.0
            tef: 0.0
            days_in_month: 31
            source_batched_at: 2026-02-01 00:00:00-0
            fecha_data: 2025-02-01 00:00:00-0
    expect:
      rows:
        - periodo: 2025-01-01
          anio: 2025
          mes: 1
          prod_pet_m3: 62.0
          tef_sum: 15.5
          days_in_month: 31
          well_month_row_count: 2
          rate_m3_dia: 2.0
          productivity_m3_dia: 4.0
          rate_method: calendar_days
          rate_bbl_dia: 12.57962154
          is_simulation: true

  - name: production_calendar_when_tef_sum_zero
    description: >
      Headline still uses days_in_month when every well has tef 0.
      productivity_m3_dia is null.
    model: fct_production_rate
    given:
      - input: ref("fct_well_month")
        rows:
          - periodo: 2025-04-01
            anio: 2025
            mes: 4
            prod_pet_m3: 60.0
            tef: 0.0
            days_in_month: 30
            source_batched_at: 2026-05-01 00:00:00-0
            fecha_data: 2025-05-01 00:00:00-0
    expect:
      rows:
        - periodo: 2025-04-01
          rate_m3_dia: 2.0
          productivity_m3_dia: null
          rate_method: calendar_days
          rate_bbl_dia: 12.57962154

  - name: production_uses_latest_cap4_month_only
    description: Grain is the latest Cap. IV month snapshot, not a rolling 30-day telemetry window.
    model: fct_production_rate
    given:
      - input: ref("fct_well_month")
        rows:
          - periodo: 2025-01-01
            anio: 2025
            mes: 1
            prod_pet_m3: 100.0
            tef: 31.0
            days_in_month: 31
            source_batched_at: 2026-02-01 00:00:00-0
            fecha_data: 2025-02-01 00:00:00-0
          - periodo: 2025-02-01
            anio: 2025
            mes: 2
            prod_pet_m3: 56.0
            tef: 14.0
            days_in_month: 28
            source_batched_at: 2026-03-01 00:00:00-0
            fecha_data: 2025-03-01 00:00:00-0
    expect:
      rows:
        - periodo: 2025-02-01
          anio: 2025
          mes: 2
          prod_pet_m3: 56.0
          rate_m3_dia: 2.0
          productivity_m3_dia: 4.0
          rate_method: calendar_days
          rate_bbl_dia: 12.57962154
