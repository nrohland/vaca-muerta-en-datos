name: Meltano ingestion (Cap IV + EIA, billing disabled)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify plugins only, or request guarded ingestion
        type: choice
        options: [verify, ingest]
        default: verify

permissions:
  contents: read

concurrency:
  group: cap4-candidate-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MELTANO_SEND_ANONYMOUS_USAGE_STATS: 'false'
      VM_RUN_ID: offline_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r extraction/requirements-meltano.txt
          python -m unittest discover -s extraction/singer/tests
          meltano install extractor tap-cap4 tap-eia-prices
          meltano install loader target-bigquery target-bigquery-prices
          meltano invoke tap-cap4 --discover > "$RUNNER_TEMP/cap4-catalog.json"
          meltano invoke tap-eia-prices --discover > "$RUNNER_TEMP/prices-catalog.json"
          meltano invoke target-bigquery --about
          meltano invoke target-bigquery-prices --about

  extract:
    needs: verify
    # No manual bypass: both source readiness and the existing enable flag are required.
    if: github.ref == 'refs/heads/main' && inputs.mode == 'ingest' && vars.DATA_PIPELINE_ENABLED == 'true' && vars.SOURCE_CONNECTIVITY_VERIFIED == 'true'
    runs-on: ubuntu-latest
    environment: data-dev-extract
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MELTANO_SEND_ANONYMOUS_USAGE_STATS: 'false'
      VM_RUN_ID: remote_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install ingestion plugins before authentication
        run: |
          python -m pip install -r extraction/requirements-meltano.txt
          meltano install extractor tap-cap4 tap-eia-prices
          meltano install loader target-bigquery target-bigquery-prices
      - name: Require public source connectivity before authentication
        run: |
          python pipeline/check_public_sources.py > "$RUNNER_TEMP/source-diagnostic.jsonl"
          cat "$RUNNER_TEMP/source-diagnostic.jsonl"
          python - "$RUNNER_TEMP/source-diagnostic.jsonl" <<'PY'
          import json, sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text().splitlines()[-1])
          if report.get('origin_status') != 'reachable':
              raise SystemExit('Official source unavailable: ingestion remains blocked')
          PY
      - name: Authenticate extraction (existing restricted WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_EXTRACT_SA }}
      - name: Run the only ingestion pipeline
        run: meltano run candidate-history
      - name: Report isolated completion without publication
        run: python pipeline/singer_completion.py
