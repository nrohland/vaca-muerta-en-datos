# Version-update PRs are disabled; native security-update PRs remain enabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 0
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /extraction
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /transform
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
