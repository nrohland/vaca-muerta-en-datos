      oil_reference_value_usd: 5031.848615999999
      oil_valuation_available: true
      oil_valuation_status: available
      gas_valuation_available: false
      gas_reference_value_usd: null
    - well_month_id: b
      oil_reference_value_usd: null
      oil_valuation_available: false
      oil_valuation_status: missing_price
      gas_valuation_available: false
      gas_reference_value_usd: null
