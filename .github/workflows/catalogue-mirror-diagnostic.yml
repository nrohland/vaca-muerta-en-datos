name: Catalogue mirror diagnosis
on:
  push:
    branches: [test/catalogue-mirror-connectivity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect national catalogue and pinned public mirror
        run: timeout 240s python3 pipeline/check_catalogue_mirrors.py --lookup-only
